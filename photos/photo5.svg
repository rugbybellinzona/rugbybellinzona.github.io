<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#2d5a1b"/>
  <!-- Scrum silhouette - two groups of players -->
  <!-- Left group -->
  <circle cx="160" cy="200" r="28" fill="#1a1a1a"/>
  <circle cx="210" cy="185" r="28" fill="#222"/>
  <circle cx="135" cy="230" r="25" fill="#1a1a1a"/>
  <!-- Right group -->
  <circle cx="440" cy="200" r="28" fill="#b30000"/>
  <circle cx="390" cy="185" r="28" fill="#c00"/>
  <circle cx="465" cy="230" r="25" fill="#b30000"/>
  <!-- Center merge area -->
  <rect x="230" y="175" width="140" height="55" rx="6" fill="#333" opacity="0.5"/>
  <text x="300" y="320" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="bold">Mischia</text>
  <text x="300" y="55" text-anchor="middle" fill="#ccc" font-family="Arial" font-size="13">Rugby Bellinzona – in azione</text>
</svg>
