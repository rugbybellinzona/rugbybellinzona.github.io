<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="60%" stop-color="#ffcc02"/>
      <stop offset="100%" stop-color="#3d8b20"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sunset)"/>
  <!-- Field lines -->
  <rect x="60" y="250" width="480" height="100" fill="#3d8b20" opacity="0.8"/>
  <line x1="300" y1="250" x2="300" y2="350" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Silhouette of player running with ball -->
  <circle cx="300" cy="200" r="18" fill="#1a1a1a"/>
  <rect x="290" y="218" width="20" height="50" rx="4" fill="#1a1a1a"/>
  <!-- Arm holding ball -->
  <line x1="310" y1="240" x2="345" y2="260" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="355" cy="265" rx="18" ry="11" fill="#8B4513" transform="rotate(-20 355 265)"/>
  <!-- Legs -->
  <line x1="295" y1="268" x2="280" y2="310" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <line x1="305" y1="268" x2="320" y2="308" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="380" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Rugby Bellinzona</text>
</svg>
