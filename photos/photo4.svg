<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a1a1a"/>
  <!-- Trophy -->
  <rect x="265" y="260" width="70" height="20" rx="4" fill="#d4a017"/>
  <rect x="280" y="230" width="40" height="40" fill="#d4a017"/>
  <!-- Cup body -->
  <ellipse cx="300" cy="160" rx="70" ry="80" fill="#f5c518"/>
  <ellipse cx="300" cy="160" rx="55" ry="65" fill="#d4a017"/>
  <!-- Handles -->
  <path d="M230 130 Q200 160 230 190" fill="none" stroke="#f5c518" stroke-width="12" stroke-linecap="round"/>
  <path d="M370 130 Q400 160 370 190" fill="none" stroke="#f5c518" stroke-width="12" stroke-linecap="round"/>
  <!-- Star on cup -->
  <polygon points="300,110 308,132 332,132 313,146 320,168 300,154 280,168 287,146 268,132 292,132" fill="#fff" opacity="0.8"/>
  <text x="300" y="350" text-anchor="middle" fill="#f5c518" font-family="Arial" font-size="18" font-weight="bold">Campioni!</text>
  <text x="300" y="50" text-anchor="middle" fill="#ccc" font-family="Arial" font-size="13">Rugby Bellinzona</text>
</svg>
