<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a1a1a"/>
  <rect x="50" y="80" width="500" height="240" rx="8" fill="#2d5a1b"/>
  <!-- Field lines -->
  <line x1="300" y1="80" x2="300" y2="320" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <rect x="200" y="120" width="200" height="160" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Rugby ball -->
  <ellipse cx="300" cy="200" rx="40" ry="24" fill="#8B4513"/>
  <line x1="260" y1="200" x2="340" y2="200" stroke="#fff" stroke-width="2"/>
  <line x1="300" y1="176" x2="300" y2="224" stroke="#fff" stroke-width="2"/>
  <!-- Text -->
  <text x="300" y="370" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="bold">Rugby Bellinzona</text>
  <text x="300" y="60" text-anchor="middle" fill="#ccc" font-family="Arial" font-size="13">Partita in casa</text>
</svg>
