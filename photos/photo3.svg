<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#c8e6f5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="270" width="600" height="130" fill="#3d8b20"/>
  <!-- Goal posts -->
  <rect x="270" y="80" width="8" height="190" fill="#f5c518"/>
  <rect x="218" y="130" width="164" height="8" fill="#f5c518"/>
  <rect x="218" y="80" width="8" height="58" fill="#f5c518"/>
  <rect x="374" y="80" width="8" height="58" fill="#f5c518"/>
  <!-- Ball in flight -->
  <ellipse cx="430" cy="160" rx="22" ry="14" fill="#8B4513" transform="rotate(-30 430 160)"/>
  <line x1="412" y1="151" x2="448" y2="169" stroke="#fff" stroke-width="1.5"/>
  <text x="300" y="370" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="bold">Meta!</text>
  <text x="300" y="60" text-anchor="middle" fill="#1a1a1a" font-family="Arial" font-size="13">Allenamento</text>
</svg>
