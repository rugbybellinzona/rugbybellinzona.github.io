<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto – Rugby Bellinzona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a class="header-logo" href="index.html">
            <div class="club-initials">RB</div>
            <span class="club-name">Rugby Bellinzona</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="photos.html" class="active">Foto</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-header">
        <h1>Galleria Foto</h1>
        <!-- <p>Immagini dalla nostra squadra, partite e allenamenti</p> -->
    </div>

    <main>
        <!-- <h2 class="section-title">Le nostre foto</h2> -->
        <div class="gallery">
            {% for photo in site.data.photos %}
            <div class="gallery-item">
                <a href="photos/{{ photo.file }}" target="_blank">
                    <img src="photos/{{ photo.file }}">
                </a>
                <!-- <div class="caption">Partita in casa</div> -->
            </div>
            {% endfor %}
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Rugby Bellinzona. Tutti i diritti riservati.</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
